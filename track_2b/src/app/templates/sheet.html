<h2>{{t:new}}</h2>
<button class="option press" data-go="camera"><span class="ico">📷</span><span><strong>{{t:sheet.photo}}</strong><br><span class="muted small">{{t:sheet.photo2}}</span></span></button>
<button class="option press desktop-only" data-go="upload"><span class="ico">📄</span><span><strong>{{t:sheet.upload}}</strong><br><span class="muted small">{{t:sheet.upload2}}</span></span></button>
<button class="option press" data-go="forms"><span class="ico second-ico">🎙️</span><span><strong>{{t:sheet.open}}</strong><br><span class="muted small">{{t:sheet.open2}}</span></span></button>
<button class="btn outline block press" data-sheet-close>{{t:cancel}}</button>
