<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%238B6CFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/lame.min.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app" id="app">

    <aside class="side">
        <span class="wordmark"><i></i><span data-i18n="app.name"></span></span>
        <nav class="side-nav">
            <button class="side-item press" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="today"></span></button>
            <button class="side-item press" data-tab="forms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span data-i18n="forms"></span></button>
            <button class="side-item press" data-tab="sent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c4-6 8-9 16-9M4 20h5l10-10-4-4L5 16z"/></svg><span data-i18n="signature"></span></button>
            <button class="side-item press" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-i18n="more"></span></button>
        </nav>
        <button class="btn block press" data-new><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="new"></span></button>
        <span class="chip accent side-mock" data-i18n="mock"></span>
    </aside>

    <main class="stage" id="stage">

        <section class="screen active" id="s-home" data-root>
            <div class="topbar"><span class="wordmark"><i></i><span data-i18n="app.name"></span></span><span class="grow"></span><span class="chip accent" data-i18n="mock"></span></div>
            <div class="scroll" data-body></div>
        </section>

        <section class="screen no-tabs dark" id="s-camera">
            <div class="topbar"><button class="iconbtn press" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button><h2 class="grow title" data-i18n="cam.title"></h2></div>
            <div class="viewfinder">
                <video data-video playsinline autoplay muted hidden></video>
                <img data-shot alt="" hidden>
                <canvas class="overlay" data-overlay hidden></canvas>
                <div class="frame"></div>
                <p class="hint" data-hint></p>
            </div>
            <div class="pagebar" data-pagebar hidden>
                <div class="pagestrip" data-strip></div>
                <button class="btn outline sm press" type="button" data-next data-i18n="cam.next"></button>
                <button class="btn accent sm press" type="button" data-done></button>
            </div>
            <div class="shutterbar">
                <button class="btn outline sm press" type="button" data-nophoto data-i18n="cam.nophoto"></button>
                <label class="shutter press" data-shutter aria-label="Shutter"><input type="file" accept="image/*" capture="environment" multiple data-file hidden></label>
                <button class="btn outline sm press" type="button" data-retake hidden data-i18n="cam.retake"></button>
            </div>
        </section>

        <section class="screen no-tabs wide" id="s-verify">
            <div class="topbar"><button class="iconbtn press" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><span class="grow"></span></div>
            <div class="scroll" data-body></div>
            <div class="bottom" data-bottom></div>
        </section>

        <section class="screen" id="s-forms" data-root>
            <div class="topbar"><h1 class="grow title" data-i18n="forms"></h1></div>
            <div class="scroll" data-body></div>
        </section>

        <section class="screen no-tabs wide" id="s-form">
            <div class="topbar"><button class="iconbtn press" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><span class="grow"></span></div>
            <div class="scroll" data-body></div>
            <div class="bottom" data-bottom></div>
        </section>

        <section class="screen no-tabs" id="s-record">
            <div class="topbar"><button class="iconbtn press" data-cancel aria-label="Cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><span class="grow"></span><span class="row small"><span class="dot pulse"></span>&nbsp;<span data-i18n="rec.badge"></span></span></div>
            <div class="recwrap">
                <div class="orb"><span class="dot pulse"></span></div>
                <h1 data-i18n="rec.head"></h1>
                <p class="muted hint" data-hint></p>
                <canvas class="wave" data-wave width="680" height="180"></canvas>
                <div class="timer num" data-timer>0:00</div>
                <p class="small muted num" data-pieces></p>
                <div class="grid2 tips">
                    <div class="cell small" data-i18n="rec.tip1"></div>
                    <div class="cell small" data-i18n="rec.tip2"></div>
                </div>
            </div>
            <div class="bottom"><button class="btn block press" data-stop data-i18n="rec.stop"></button></div>
        </section>

        <section class="screen no-tabs" id="s-sign">
            <div class="topbar"><button class="iconbtn press" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><span class="grow"></span></div>
            <div class="scroll" data-body></div>
            <div class="bottom"><button class="btn block press" data-send data-i18n="sign.send"></button></div>
        </section>

        <section class="screen" id="s-sent" data-root>
            <div class="topbar"><h1 class="grow title" data-i18n="signature"></h1></div>
            <div class="scroll" data-body></div>
        </section>

        <section class="screen" id="s-more" data-root>
            <div class="topbar"><h1 class="grow title" data-i18n="more"></h1></div>
            <div class="scroll" data-body></div>
        </section>

        <div class="dim"></div>

        <nav class="tabs">
            <button class="tab press" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="today"></span></button>
            <button class="tab press" data-tab="forms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span data-i18n="forms"></span></button>
            <button class="tab main press" data-new aria-label="New"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="tab press" data-tab="sent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c4-6 8-9 16-9M4 20h5l10-10-4-4L5 16z"/></svg><span data-i18n="signature"></span></button>
            <button class="tab press" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-i18n="more"></span></button>
        </nav>

        <div class="sheet">
            <div class="sheet-back" data-sheet-close></div>
            <div class="sheet-inner" data-body></div>
        </div>

        <div class="toast" data-toast></div>
        <input type="file" accept="image/*" multiple data-upload hidden>
    </main>
</div>
</body>
</html>
