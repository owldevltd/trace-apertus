services:
  trace:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # the model: from the shell that runs `make run`, or from .env beside this file
      LLM_NAME:
      LLM_BASE_URL:
      LLM_API_KEY:
    volumes:
      - ./storage:/app/storage
